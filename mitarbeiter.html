<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FlaschenlandOPS – Mitarbeiter</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        header {
            background: #ffffff;
            border-bottom: 1px solid #e4e8ef;
            min-height: 70px;
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .small-logo {
            width: 42px;
            height: 42px;
            border-radius: 11px;
            background: #1769e0;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 23px;
            font-weight: 800;
        }

        .brand {
            font-size: 20px;
            font-weight: 800;
        }

        .employee-name {
            color: #6b7280;
            font-size: 13px;
            margin-top: 2px;
        }

        .logout-button {
            border: 1px solid #d8dee8;
            background: #ffffff;
            color: #374151;
            padding: 10px 15px;
            border-radius: 9px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .logout-button:hover {
            background: #f5f7fa;
        }

        main {
            width: 100%;
            max-width: 1050px;
            margin: 0 auto;
            padding: 30px 20px 50px;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h1 {
            font-size: 28px;
            margin-bottom: 7px;
        }

        .welcome p {
            color: #6b7280;
            font-size: 15px;
        }

        .status-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 25px;
            border: 1px solid #e5e9f0;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.04);
        }

        .status-label {
            color: #6b7280;
            font-size: 13px;
            margin-bottom: 7px;
        }

        .status-process {
            font-size: 25px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .status-time {
            font-size: 22px;
            font-weight: 800;
            color: #1769e0;
            margin-bottom: 18px;
        }

        .no-process {
            color: #6b7280;
            font-size: 19px;
            font-weight: 600;
            margin-bottom: 0;
        }

        .stop-button {
            display: none;
            width: 100%;
            min-height: 52px;
            border: none;
            border-radius: 10px;
            background: #c62828;
            color: #ffffff;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
        }

        .stop-button.visible {
            display: block;
        }

        .stop-button:hover {
            background: #a91f1f;
        }

        .stop-button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .section-title {
            font-size: 20px;
            margin-bottom: 15px;
        }

        .process-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .process-button {
            min-height: 145px;
            background: #ffffff;
            border: 2px solid #e0e5ed;
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .process-button:hover {
            border-color: #1769e0;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.07);
        }

        .process-button.active {
            border-color: #1769e0;
            background: #eef5ff;
        }

        .process-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .process-icon {
            font-size: 36px;
            margin-bottom: 12px;
        }

        .process-name {
            font-size: 18px;
            font-weight: 800;
        }

        .process-state {
            margin-top: 7px;
            font-size: 12px;
            color: #6b7280;
        }

        .process-button.active .process-state {
            color: #1769e0;
            font-weight: 700;
        }

        .quantity-card {
            display: none;
            background: #ffffff;
            border-radius: 16px;
            padding: 22px;
            margin-top: 25px;
            border: 1px solid #e5e9f0;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.04);
        }

        .quantity-card.visible {
            display: block;
        }

        .quantity-title {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 7px;
        }

        .quantity-description {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 18px;
        }

        .quantity-row {
            display: flex;
            gap: 12px;
            align-items: end;
        }

        .quantity-input-wrapper {
            flex: 1;
        }

        .quantity-input-wrapper label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 7px;
        }

        .quantity-input {
            width: 100%;
            height: 50px;
            border: 1px solid #d5dbe5;
            border-radius: 9px;
            padding: 0 14px;
            font-size: 17px;
            outline: none;
        }

        .quantity-input:focus {
            border-color: #1769e0;
            box-shadow: 0 0 0 3px rgba(23, 105, 224, 0.1);
        }

        .save-button {
            height: 50px;
            padding: 0 22px;
            border: none;
            border-radius: 9px;
            background: #1769e0;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .save-button:hover {
            background: #0d57c7;
        }

        .save-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            padding: 13px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.4;
        }

        .message.error {
            display: block;
            background: #fff1f1;
            border: 1px solid #f0c5c5;
            color: #b42318;
        }

        .message.success {
            display: block;
            background: #effcf3;
            border: 1px solid #b9e3c3;
            color: #18743a;
        }

        footer {
            text-align: center;
            color: #8a93a3;
            font-size: 12px;
            padding: 20px;
        }

        footer a {
            color: #6b7280;
            text-decoration: none;
            margin: 0 6px;
        }

        footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 800px) {
            .process-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            header {
                padding: 10px 15px;
            }

            .brand {
                font-size: 17px;
            }

            .employee-name {
                font-size: 12px;
            }

            main {
                padding: 22px 14px 40px;
            }

            .welcome h1 {
                font-size: 24px;
            }

            .process-grid {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .process-button {
                min-height: 125px;
                padding: 14px;
            }

            .process-icon {
                font-size: 30px;
                margin-bottom: 8px;
            }

            .process-name {
                font-size: 16px;
            }

            .quantity-row {
                flex-direction: column;
                align-items: stretch;
            }

            .save-button {
                width: 100%;
            }

            .stop-button {
                min-height: 56px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="header-left">
        <div class="small-logo">F</div>

        <div>
            <div class="brand">FlaschenlandOPS</div>

            <div
                class="employee-name"
                id="employeeName"
            >
                Wird geladen...
            </div>
        </div>
    </div>

    <button
        class="logout-button"
        id="logoutButton"
        type="button"
    >
        Abmelden
    </button>
</header>


<main>

    <div class="welcome">
        <h1>Arbeitsprozess</h1>

        <p>
            Wähle den Prozess aus, an dem du gerade arbeitest.
        </p>
    </div>


    <div
        id="message"
        class="message"
    ></div>


    <!-- AKTUELLER STATUS -->

    <div class="status-card">

        <div class="status-label">
            Aktueller Prozess
        </div>

        <div
            id="currentProcess"
            class="no-process"
        >
            Kein Prozess aktiv
        </div>

        <div
            id="currentTime"
            class="status-time"
            style="display:none;"
        >
            00:00:00
        </div>

        <button
            id="stopProcessButton"
            class="stop-button"
            type="button"
        >
            ⏹ Prozess stoppen
        </button>

    </div>


    <!-- PROZESSE -->

    <h2 class="section-title">
        Prozesse
    </h2>

    <div class="process-grid">

        <button
            class="process-button"
            data-process="Wareneingang"
            type="button"
        >
            <div class="process-icon">📦</div>

            <div class="process-name">
                Wareneingang
            </div>

            <div class="process-state">
                Wannen
            </div>
        </button>


        <button
            class="process-button"
            data-process="Pick"
            type="button"
        >
            <div class="process-icon">🛒</div>

            <div class="process-name">
                Pick
            </div>

            <div class="process-state">
                Wannen
            </div>
        </button>


        <button
            class="process-button"
            data-process="Pack"
            type="button"
        >
            <div class="process-icon">📦</div>

            <div class="process-name">
                Pack
            </div>

            <div class="process-state">
                Pakete
            </div>
        </button>


        <button
            class="process-button"
            data-process="Service"
            type="button"
        >
            <div class="process-icon">🎧</div>

            <div class="process-name">
                Service
            </div>

            <div class="process-state">
                Nur Zeit
            </div>
        </button>

    </div>


    <!-- MENGENEINGABE -->

    <div
        id="quantityCard"
        class="quantity-card"
    >

        <div
            id="quantityTitle"
            class="quantity-title"
        >
            Menge eintragen
        </div>

        <div
            id="quantityDescription"
            class="quantity-description"
        >
            Trag hier deine Menge für heute ein.
        </div>

        <div class="quantity-row">

            <div class="quantity-input-wrapper">

                <label for="quantityInput">
                    Menge
                </label>

                <input
                    type="number"
                    id="quantityInput"
                    class="quantity-input"
                    min="0"
                    step="1"
                    placeholder="0"
                    inputmode="numeric"
                >

            </div>

            <button
                id="saveQuantityButton"
                class="save-button"
                type="button"
            >
                Menge speichern
            </button>

        </div>

    </div>

</main>


<footer>
    <div>FlaschenlandOPS</div>

    <div style="margin-top:8px;">
        <a href="datenschutz.html">Datenschutz</a>
        <a href="impressum.html">Impressum</a>
        <a href="agb.html">AGB</a>
    </div>
</footer>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

    /* ============================================================
       SUPABASE
    ============================================================ */

    const SUPABASE_URL =
        "https://kmdsltojdpfpsatwgfcg.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_dpG11d2sSHDTn-2Y5cCAsQ_dPVSBAGo";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    /* ============================================================
       ELEMENTE
    ============================================================ */

    const employeeName =
        document.getElementById("employeeName");

    const logoutButton =
        document.getElementById("logoutButton");

    const message =
        document.getElementById("message");

    const currentProcess =
        document.getElementById("currentProcess");

    const currentTime =
        document.getElementById("currentTime");

    const stopProcessButton =
        document.getElementById("stopProcessButton");

    const processButtons =
        document.querySelectorAll(".process-button");

    const quantityCard =
        document.getElementById("quantityCard");

    const quantityTitle =
        document.getElementById("quantityTitle");

    const quantityDescription =
        document.getElementById("quantityDescription");

    const quantityInput =
        document.getElementById("quantityInput");

    const saveQuantityButton =
        document.getElementById("saveQuantityButton");


    /* ============================================================
       VARIABLEN
    ============================================================ */

    let currentUser = null;

    let currentProfile = null;

    let processes = [];

    let activeSession = null;

    let timerInterval = null;

    let busy = false;


    /* ============================================================
       HILFSFUNKTIONEN
    ============================================================ */

    function showMessage(text, type = "error") {

        message.textContent = text;

        message.className =
            "message " + type;

    }


    function clearMessage() {

        message.textContent = "";

        message.className =
            "message";

    }


    function formatDuration(milliseconds) {

        if (!Number.isFinite(milliseconds) || milliseconds < 0) {
            milliseconds = 0;
        }

        const totalSeconds =
            Math.floor(milliseconds / 1000);

        const hours =
            Math.floor(totalSeconds / 3600);

        const minutes =
            Math.floor(
                (totalSeconds % 3600) / 60
            );

        const seconds =
            totalSeconds % 60;

        return [
            String(hours).padStart(2, "0"),
            String(minutes).padStart(2, "0"),
            String(seconds).padStart(2, "0")
        ].join(":");
    }


    function getProcessById(processId) {

        return processes.find(
            process => String(process.id) === String(processId)
        );
    }


    function getProcessByName(name) {

        return processes.find(
            process => process.name === name
        );
    }


    function getActiveProcess() {

        if (!activeSession) {
            return null;
        }

        return getProcessById(
            activeSession.process_id
        );
    }


    function getTodayLocalDate() {

        const now = new Date();

        const year =
            now.getFullYear();

        const month =
            String(now.getMonth() + 1)
                .padStart(2, "0");

        const day =
            String(now.getDate())
                .padStart(2, "0");

        return `${year}-${month}-${day}`;
    }


    function stopTimer() {

        if (timerInterval !== null) {

            clearInterval(timerInterval);

            timerInterval = null;
        }
    }


    function startTimer() {

        stopTimer();

        if (!activeSession) {
            return;
        }

        updateTimer();

        timerInterval =
            setInterval(
                updateTimer,
                1000
            );
    }


    function updateTimer() {

        if (!activeSession) {

            currentTime.style.display =
                "none";

            return;
        }

        const started =
            new Date(
                activeSession.started_at
            );

        const now =
            new Date();

        const elapsed =
            now.getTime() -
            started.getTime();

        currentTime.textContent =
            formatDuration(elapsed);
    }


    function setProcessButtonsDisabled(disabled) {

        processButtons.forEach(button => {

            button.disabled = disabled;

        });
    }


    function updateProcessButtonStates() {

        processButtons.forEach(button => {

            const processName =
                button.dataset.process;

            const isActive =
                activeSession &&
                getActiveProcess() &&
                getActiveProcess().name === processName;

            button.classList.toggle(
                "active",
                Boolean(isActive)
            );

            const state =
                button.querySelector(".process-state");

            if (!state) {
                return;
            }

            if (isActive) {

                const process =
                    getActiveProcess();

                state.textContent =
                    process && process.tracks_quantity
                        ? "Aktiv · Menge"
                        : "Aktiv · Nur Zeit";

            } else {

                if (processName === "Service") {
                    state.textContent =
                        "Nur Zeit";
                } else if (
                    processName === "Pack"
                ) {
                    state.textContent =
                        "Pakete";
                } else {
                    state.textContent =
                        "Wannen";
                }
            }
        });
    }


    function updateStatusUI() {

        const process =
            getActiveProcess();

        if (!activeSession || !process) {

            currentProcess.textContent =
                "Kein Prozess aktiv";

            currentProcess.className =
                "no-process";

            currentTime.style.display =
                "none";

            stopProcessButton.classList.remove(
                "visible"
            );

            quantityCard.classList.remove(
                "visible"
            );

            stopTimer();

            updateProcessButtonStates();

            return;
        }


        currentProcess.textContent =
            process.name;

        currentProcess.className =
            "status-process";

        currentTime.style.display =
            "block";

        stopProcessButton.classList.add(
            "visible"
        );


        if (process.tracks_quantity) {

            quantityCard.classList.add(
                "visible"
            );

            quantityTitle.textContent =
                process.name + " – Menge";

            quantityDescription.textContent =
                process.quantity_unit === "Pakete"
                    ? "Trag hier die heute bearbeiteten Pakete ein."
                    : "Trag hier die heute bearbeiteten Wannen ein.";

        } else {

            quantityCard.classList.remove(
                "visible"
            );

            quantityInput.value = "";
        }


        updateProcessButtonStates();

        startTimer();
    }


    /* ============================================================
       PROFIL LADEN
    ============================================================ */

    async function loadProfile() {

        const {
            data,
            error
        } = await supabaseClient
            .from("profiles")
            .select("*")
            .eq("id", currentUser.id)
            .single();

        if (error) {
            throw new Error(
                "Mitarbeiterprofil konnte nicht geladen werden."
            );
        }

        if (!data) {
            throw new Error(
                "Kein Mitarbeiterprofil gefunden."
            );
        }

        if (!data.active) {

            await supabaseClient.auth.signOut();

            window.location.href =
                "index.html";

            return;
        }

        currentProfile = data;

        employeeName.textContent =
            `${data.first_name} ${data.last_name}`;
    }


    /* ============================================================
       PROZESSE LADEN
    ============================================================ */

    async function loadProcesses() {

        const {
            data,
            error
        } = await supabaseClient
            .from("processes")
            .select("*")
            .eq("active", true)
            .order("sort_order", {
                ascending: true
            });

        if (error) {

            throw new Error(
                "Prozesse konnten nicht geladen werden."
            );
        }

        processes = data || [];
    }


    /* ============================================================
       AKTIVE SESSION LADEN
    ============================================================ */

    async function loadActiveSession() {

        const {
            data,
            error
        } = await supabaseClient
            .from("work_sessions")
            .select("*")
            .eq("employee_id", currentUser.id)
            .is("ended_at", null)
            .order("started_at", {
                ascending: false
            })
            .limit(1);

        if (error) {

            throw new Error(
                "Aktiver Prozess konnte nicht geladen werden."
            );
        }


        if (data && data.length > 0) {

            activeSession =
                data[0];

        } else {

            activeSession =
                null;
        }


        updateStatusUI();
    }


    /* ============================================================
       PROZESS STARTEN
    ============================================================ */

    async function startProcess(processName) {

        if (busy) {
            return;
        }

        const process =
            getProcessByName(processName);

        if (!process) {

            showMessage(
                "Der ausgewählte Prozess wurde nicht gefunden."
            );

            return;
        }


        /*
         * Wenn derselbe Prozess bereits aktiv ist,
         * machen wir nichts.
         */

        if (
            activeSession &&
            getActiveProcess() &&
            getActiveProcess().id === process.id
        ) {

            showMessage(
                `${process.name} läuft bereits.`,
                "success"
            );

            return;
        }


        busy = true;

        clearMessage();

        setProcessButtonsDisabled(true);

        stopProcessButton.disabled = true;


        try {

            /*
             * Falls bereits ein Prozess läuft,
             * wird dieser zuerst beendet.
             */

            if (activeSession) {

                const oldSessionId =
                    activeSession.id;

                const {
                    error: endError
                } = await supabaseClient
                    .from("work_sessions")
                    .update({
                        ended_at:
                            new Date().toISOString()
                    })
                    .eq("id", oldSessionId)
                    .eq("employee_id", currentUser.id)
                    .is("ended_at", null);

                if (endError) {
                    throw endError;
                }

                activeSession = null;

                stopTimer();
            }


            /*
             * Neue Session starten.
             */

            const {
                data,
                error
            } = await supabaseClient
                .from("work_sessions")
                .insert({
                    employee_id:
                        currentUser.id,

                    process_id:
                        process.id,

                    started_at:
                        new Date().toISOString()
                })
                .select("*")
                .single();


            if (error) {
                throw error;
            }


            activeSession = data;

            updateStatusUI();

            showMessage(
                `${process.name} gestartet.`,
                "success"
            );

        } catch (error) {

            console.error(
                "startProcess:",
                error
            );

            await loadActiveSession();

            showMessage(
                error.message ||
                "Der Prozess konnte nicht gestartet werden."
            );

        } finally {

            busy = false;

            setProcessButtonsDisabled(false);

            stopProcessButton.disabled =
                false;

            updateStatusUI();
        }
    }


    /* ============================================================
       PROZESS STOPPEN
    ============================================================ */

    async function stopProcess() {

        if (busy) {
            return;
        }

        if (!activeSession) {

            updateStatusUI();

            return;
        }


        const activeProcess =
            getActiveProcess();


        busy = true;

        clearMessage();

        setProcessButtonsDisabled(true);

        stopProcessButton.disabled = true;


        try {

            const sessionId =
                activeSession.id;


            /*
             * Aktuelle Session serverseitig beenden.
             *
             * Die Zeit wird als UTC-Zeit gespeichert.
             */

            const {
                data,
                error
            } = await supabaseClient
                .from("work_sessions")
                .update({
                    ended_at:
                        new Date().toISOString()
                })
                .eq("id", sessionId)
                .eq("employee_id", currentUser.id)
                .is("ended_at", null)
                .select("*");


            if (error) {
                throw error;
            }


            /*
             * Wenn keine Zeile geändert wurde,
             * prüfen wir den aktuellen Zustand erneut.
             */

            if (!data || data.length === 0) {

                const {
                    data: checkData,
                    error: checkError
                } = await supabaseClient
                    .from("work_sessions")
                    .select("*")
                    .eq("id", sessionId)
                    .eq("employee_id", currentUser.id)
                    .single();

                if (checkError) {
                    throw checkError;
                }

                if (checkData.ended_at === null) {

                    throw new Error(
                        "Der Prozess konnte nicht beendet werden."
                    );
                }
            }


            activeSession = null;

            stopTimer();

            updateStatusUI();


            showMessage(
                activeProcess
                    ? `${activeProcess.name} wurde gestoppt.`
                    : "Prozess wurde gestoppt.",
                "success"
            );

        } catch (error) {

            console.error(
                "stopProcess:",
                error
            );

            await loadActiveSession();

            showMessage(
                error.message ||
                "Der Prozess konnte nicht gestoppt werden."
            );

        } finally {

            busy = false;

            setProcessButtonsDisabled(false);

            stopProcessButton.disabled =
                false;

            updateStatusUI();
        }
    }


    /* ============================================================
       MENGE LADEN
    ============================================================ */

    async function loadTodayQuantity() {

        if (!currentUser || !activeSession) {
            return;
        }

        const process =
            getActiveProcess();

        if (!process || !process.tracks_quantity) {
            return;
        }


        const today =
            getTodayLocalDate();


        const {
            data,
            error
        } = await supabaseClient
            .from("daily_quantities")
            .select("quantity")
            .eq("employee_id", currentUser.id)
            .eq("process_id", process.id)
            .eq("work_date", today)
            .maybeSingle();


        if (error) {

            console.error(
                "loadTodayQuantity:",
                error
            );

            return;
        }


        if (data) {

            quantityInput.value =
                data.quantity;
        } else {

            quantityInput.value = "";
        }
    }


    /* ============================================================
       MENGE SPEICHERN
    ============================================================ */

    async function saveQuantity() {

        if (busy) {
            return;
        }

        if (!activeSession) {

            showMessage(
                "Bitte zuerst einen Prozess starten."
            );

            return;
        }


        const process =
            getActiveProcess();

        if (!process || !process.tracks_quantity) {

            showMessage(
                "Für diesen Prozess gibt es keine Mengeneingabe."
            );

            return;
        }


        const rawValue =
            quantityInput.value.trim();

        if (rawValue === "") {

            showMessage(
                "Bitte eine Menge eingeben."
            );

            return;
        }


        const quantity =
            Number(rawValue);


        if (
            !Number.isInteger(quantity) ||
            quantity < 0
        ) {

            showMessage(
                "Bitte eine gültige ganze Zahl ab 0 eingeben."
            );

            return;
        }


        busy = true;

        saveQuantityButton.disabled = true;

        clearMessage();


        try {

            const today =
                getTodayLocalDate();


            const {
                error
            } = await supabaseClient
                .from("daily_quantities")
                .upsert(
                    {
                        employee_id:
                            currentUser.id,

                        process_id:
                            process.id,

                        work_date:
                            today,

                        quantity:
                            quantity,

                        updated_at:
                            new Date().toISOString()
                    },
                    {
                        onConflict:
                            "employee_id,process_id,work_date"
                    }
                );


            if (error) {
                throw error;
            }


            showMessage(
                `${process.name}: ${quantity} ${process.quantity_unit || "Einheiten"} gespeichert.`,
                "success"
            );

        } catch (error) {

            console.error(
                "saveQuantity:",
                error
            );

            showMessage(
                error.message ||
                "Die Menge konnte nicht gespeichert werden."
            );

        } finally {

            busy = false;

            saveQuantityButton.disabled =
                false;
        }
    }


    /* ============================================================
       ABMELDEN
    ============================================================ */

    async function logout() {

        if (busy) {
            return;
        }

        busy = true;

        logoutButton.disabled = true;

        stopProcessButton.disabled = true;

        setProcessButtonsDisabled(true);


        try {

            /*
             * Wenn ein Prozess läuft, wird er beim
             * Abmelden automatisch beendet.
             */

            if (activeSession) {

                const {
                    error
                } = await supabaseClient
                    .from("work_sessions")
                    .update({
                        ended_at:
                            new Date().toISOString()
                    })
                    .eq("id", activeSession.id)
                    .eq("employee_id", currentUser.id)
                    .is("ended_at", null);

                if (error) {
                    console.error(
                        "Session beim Abmelden:",
                        error
                    );
                }
            }

        } finally {

            stopTimer();

            activeSession = null;

            await supabaseClient.auth.signOut();

            window.location.href =
                "index.html";
        }
    }


    /* ============================================================
       EVENTS
    ============================================================ */

    processButtons.forEach(button => {

        button.addEventListener(
            "click",
            async () => {

                const processName =
                    button.dataset.process;

                await startProcess(
                    processName
                );

                if (activeSession) {
                    await loadTodayQuantity();
                }
            }
        );
    });


    stopProcessButton.addEventListener(
        "click",
        async () => {

            await stopProcess();
        }
    );


    saveQuantityButton.addEventListener(
        "click",
        async () => {

            await saveQuantity();
        }
    );


    logoutButton.addEventListener(
        "click",
        async () => {

            await logout();
        }
    );


    quantityInput.addEventListener(
        "keydown",
        async event => {

            if (event.key === "Enter") {

                event.preventDefault();

                await saveQuantity();
            }
        }
    );


    /* ============================================================
       AUTH STATE
    ============================================================ */

    supabaseClient.auth.onAuthStateChange(
        async (event, session) => {

            if (
                event === "SIGNED_OUT"
            ) {

                stopTimer();

                window.location.href =
                    "index.html";

                return;
            }
        }
    );


    /* ============================================================
       INITIALISIERUNG
    ============================================================ */

    async function initialize() {

        try {

            clearMessage();


            const {
                data,
                error
            } = await supabaseClient
                .auth
                .getSession();


            if (error) {
                throw error;
            }


            if (!data.session) {

                window.location.href =
                    "index.html";

                return;
            }


            currentUser =
                data.session.user;


            await loadProfile();

            await loadProcesses();

            await loadActiveSession();


            if (activeSession) {
                await loadTodayQuantity();
            }


        } catch (error) {

            console.error(
                "Initialisierung:",
                error
            );

            showMessage(
                error.message ||
                "Die Mitarbeiterseite konnte nicht geladen werden."
            );
        }
    }


    initialize();

</script>
