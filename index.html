<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FlaschenlandOPS – Mitarbeiter Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
        }

        .login-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.10);
        }

        .logo {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo-box {
            width: 72px;
            height: 72px;
            margin: 0 auto 18px;
            border-radius: 18px;
            background: #2563eb;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
        }

        .logo h1 {
            font-size: 28px;
            color: #111827;
            margin-bottom: 8px;
        }

        .logo p {
            color: #6b7280;
            font-size: 15px;
        }

        .message {
            display: none;
            padding: 13px;
            border-radius: 9px;
            margin-bottom: 18px;
            font-size: 14px;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            height: 50px;
            padding: 0 14px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            font-size: 16px;
            background: #ffffff;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 50px;
        }

        .password-button {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 19px;
            padding: 5px;
        }

        .forgot-password {
            display: block;
            text-align: right;
            margin-top: -8px;
            margin-bottom: 22px;
            color: #2563eb;
            text-decoration: none;
            font-size: 13px;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .login-button {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-button:hover {
            background: #1d4ed8;
        }

        .login-button:disabled {
            background: #93c5fd;
            cursor: not-allowed;
        }

        .legal {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
            text-align: center;
            color: #6b7280;
            font-size: 12px;
            line-height: 1.8;
        }

        .legal a {
            color: #4b5563;
            text-decoration: none;
            margin: 0 5px;
        }

        .legal a:hover {
            text-decoration: underline;
        }

        .copyright {
            margin-top: 8px;
            color: #9ca3af;
            font-size: 11px;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 30px 22px;
            }

            .logo h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <!-- Logo -->
            <div class="logo">

                <div class="logo-box">
                    F
                </div>

                <h1>FlaschenlandOPS</h1>

                <p>Mitarbeiter Login</p>

            </div>


            <!-- Fehlermeldung -->
            <div
                id="errorMessage"
                class="message error">
            </div>


            <!-- Erfolgsmeldung -->
            <div
                id="successMessage"
                class="message success">
            </div>


            <!-- Login Formular -->
            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        E-Mail-Adresse
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="E-Mail-Adresse"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Passwort
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Passwort"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="passwordButton"
                            class="password-button"
                            aria-label="Passwort anzeigen">
                            👁️
                        </button>

                    </div>

                </div>


                <a
                    href="#"
                    id="forgotPassword"
                    class="forgot-password">
                    Passwort vergessen?
                </a>


                <button
                    type="submit"
                    id="loginButton"
                    class="login-button">

                    Einloggen

                </button>

            </form>


            <!-- Rechtliche Informationen -->
            <div class="legal">

                <div>

                    <a href="datenschutz.html">
                        Datenschutz
                    </a>

                    |

                    <a href="impressum.html">
                        Impressum
                    </a>

                    |

                    <a href="agb.html">
                        AGB
                    </a>

                </div>

                <div class="copyright">
                    © 2026 FlaschenlandOPS
                </div>

            </div>

        </section>

    </main>


    <script>

        const loginForm =
            document.getElementById("loginForm");

        const loginButton =
            document.getElementById("loginButton");

        const passwordInput =
            document.getElementById("password");

        const passwordButton =
            document.getElementById("passwordButton");

        const errorMessage =
            document.getElementById("errorMessage");

        const successMessage =
            document.getElementById("successMessage");

        const forgotPassword =
            document.getElementById("forgotPassword");


        /*
         * Passwort anzeigen / verstecken
         */

        passwordButton.addEventListener(
            "click",
            function () {

                if (passwordInput.type === "password") {

                    passwordInput.type = "text";

                    passwordButton.textContent = "🙈";

                    passwordButton.setAttribute(
                        "aria-label",
                        "Passwort verstecken"
                    );

                } else {

                    passwordInput.type = "password";

                    passwordButton.textContent = "👁️";

                    passwordButton.setAttribute(
                        "aria-label",
                        "Passwort anzeigen"
                    );
                }
            }
        );


        /*
         * Login
         *
         * Supabase Auth wird im nächsten Schritt
         * hier angeschlossen.
         */

        loginForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();

                hideMessages();

                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();

                const password =
                    passwordInput.value;


                if (!email || !password) {

                    showError(
                        "Bitte E-Mail-Adresse und Passwort eingeben."
                    );

                    return;
                }


                loginButton.disabled = true;

                loginButton.textContent =
                    "Anmeldung läuft...";


                try {

                    /*
                     * Hier kommt als Nächstes:
                     *
                     * Supabase Auth
                     *
                     * Die Passwörter werden NICHT
                     * in unserer eigenen Datenbank gespeichert.
                     */

                    showSuccess(
                        "Login-Oberfläche ist bereit."
                    );


                } catch (error) {

                    console.error(error);

                    showError(
                        "Die Anmeldung konnte nicht durchgeführt werden."
                    );

                } finally {

                    loginButton.disabled = false;

                    loginButton.textContent =
                        "Einloggen";
                }

            }
        );


        /*
         * Passwort vergessen
         */

        forgotPassword.addEventListener(
            "click",
            function (event) {

                event.preventDefault();

                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                if (!email) {

                    showError(
                        "Bitte zuerst deine E-Mail-Adresse eingeben."
                    );

                    document
                        .getElementById("email")
                        .focus();

                    return;
                }


                showSuccess(
                    "Die Passwort-Wiederherstellung wird mit Supabase eingerichtet."
                );

            }
        );


        /*
         * Meldungen
         */

        function showError(message) {

            errorMessage.textContent = message;

            errorMessage.style.display = "block";

            successMessage.style.display = "none";
        }


        function showSuccess(message) {

            successMessage.textContent = message;

            successMessage.style.display = "block";

            errorMessage.style.display = "none";
        }


        function hideMessages() {

            errorMessage.style.display = "none";

            successMessage.style.display = "none";
        }

    </script>

</body>
</html>
