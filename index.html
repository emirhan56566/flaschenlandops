<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FlaschenlandOPS – Mitarbeiter Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #f4f7fb 0%, #e8eef7 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #172033;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
        }

        .login-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 40px 35px 30px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.10);
        }

        .logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 22px;
            border-radius: 18px;
            background: #1769e0;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            font-weight: 800;
        }

        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 8px;
            color: #172033;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 15px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #374151;
        }

        input {
            width: 100%;
            height: 52px;
            border: 1px solid #d5dbe5;
            border-radius: 10px;
            padding: 0 15px;
            font-size: 16px;
            outline: none;
            transition: 0.2s;
            background: #ffffff;
        }

        input:focus {
            border-color: #1769e0;
            box-shadow: 0 0 0 3px rgba(23, 105, 224, 0.12);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 85px;
        }

        .password-toggle {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #1769e0;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            padding: 8px;
        }

        .password-toggle:hover {
            color: #0d4fae;
        }

        .forgot-password {
            display: block;
            text-align: right;
            margin-top: 8px;
            color: #1769e0;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .login-button {
            width: 100%;
            height: 54px;
            border: none;
            border-radius: 10px;
            background: #1769e0;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }

        .login-button:hover {
            background: #0d57c7;
        }

        .login-button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .message {
            display: none;
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 18px;
            font-size: 14px;
            line-height: 1.4;
        }

        .error-message {
            background: #fff1f1;
            color: #b42318;
            border: 1px solid #f3c1c1;
        }

        .success-message {
            background: #effcf3;
            color: #18743a;
            border: 1px solid #b7e4c2;
        }

        .legal {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #edf0f4;
            text-align: center;
            color: #7a8494;
            font-size: 12px;
            line-height: 1.7;
        }

        .legal a {
            color: #687386;
            text-decoration: none;
            margin: 0 6px;
        }

        .legal a:hover {
            color: #1769e0;
            text-decoration: underline;
        }

        .footer {
            text-align: center;
            margin-top: 15px;
            color: #8a93a3;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            .login-card {
                padding: 30px 22px 25px;
                border-radius: 16px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">F</div>

        <h1>FlaschenlandOPS</h1>

        <p class="subtitle">
            Mitarbeiter Login
        </p>

        <div id="errorMessage" class="message error-message"></div>

        <div id="successMessage" class="message success-message"></div>

        <form id="loginForm">

            <div class="form-group">
                <label for="email">
                    E-Mail-Adresse
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="name@flaschenland.de"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">

                <label for="password">
                    Passwort
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Passwort eingeben"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        id="passwordToggle"
                        class="password-toggle"
                    >
                        Anzeigen
                    </button>

                </div>

                <a
                    href="#"
                    id="forgotPassword"
                    class="forgot-password"
                >
                    Passwort vergessen?
                </a>

            </div>

            <button
                type="submit"
                id="loginButton"
                class="login-button"
            >
                Einloggen
            </button>

        </form>

        <div class="legal">

            <a href="datenschutz.html">
                Datenschutz
            </a>

            |

            <a href="impressum.html">
                Impressum
            </a>

            |

            <a href="agb.html">
                AGB
            </a>

        </div>

    </div>

    <div class="footer">
        FlaschenlandOPS
    </div>

</div>


<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    /*
     * ============================================================
     * SUPABASE VERBINDUNG
     * ============================================================
     */

    const SUPABASE_URL =
        "https://kmdsltojdpfpsatwgfcg.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_dpG11d2sSHDTn-2Y5cCAsQ_dPVSBAGo";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    /*
     * ============================================================
     * ELEMENTE
     * ============================================================
     */

    const loginForm =
        document.getElementById("loginForm");

    const emailInput =
        document.getElementById("email");

    const passwordInput =
        document.getElementById("password");

    const passwordToggle =
        document.getElementById("passwordToggle");

    const loginButton =
        document.getElementById("loginButton");

    const forgotPassword =
        document.getElementById("forgotPassword");

    const errorMessage =
        document.getElementById("errorMessage");

    const successMessage =
        document.getElementById("successMessage");


    /*
     * ============================================================
     * MELDUNGEN
     * ============================================================
     */

    function hideMessages() {

        errorMessage.style.display = "none";
        successMessage.style.display = "none";

        errorMessage.textContent = "";
        successMessage.textContent = "";
    }


    function showError(message) {

        successMessage.style.display = "none";

        errorMessage.textContent = message;
        errorMessage.style.display = "block";
    }


    function showSuccess(message) {

        errorMessage.style.display = "none";

        successMessage.textContent = message;
        successMessage.style.display = "block";
    }


    /*
     * ============================================================
     * PASSWORT ANZEIGEN / VERBERGEN
     * ============================================================
     */

    passwordToggle.addEventListener(
        "click",
        function () {

            if (passwordInput.type === "password") {

                passwordInput.type = "text";
                passwordToggle.textContent = "Verbergen";

            } else {

                passwordInput.type = "password";
                passwordToggle.textContent = "Anzeigen";
            }
        }
    );


    /*
     * ============================================================
     * LOGIN
     * ============================================================
     */

    loginForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();

            hideMessages();

            const email =
                emailInput.value.trim();

            const password =
                passwordInput.value;


            if (!email || !password) {

                showError(
                    "Bitte E-Mail-Adresse und Passwort eingeben."
                );

                return;
            }


            loginButton.disabled = true;
            loginButton.textContent =
                "Anmeldung läuft...";


            try {

                /*
                 * Benutzer bei Supabase Auth anmelden
                 */

                const {
                    data,
                    error
                } =
                    await supabaseClient.auth.signInWithPassword({
                        email: email,
                        password: password
                    });


                if (error) {
                    throw error;
                }


                const user = data.user;


                if (!user) {

                    throw new Error(
                        "Kein Benutzer zurückgegeben."
                    );
                }


                /*
                 * Mitarbeiterprofil laden
                 */

                const {
                    data: profile,
                    error: profileError
                } =
                    await supabaseClient
                        .from("profiles")
                        .select(
                            "id, first_name, last_name, role, active"
                        )
                        .eq("id", user.id)
                        .single();


                if (profileError) {
                    throw profileError;
                }


                /*
                 * Prüfen, ob Mitarbeiter aktiv ist
                 */

                if (!profile.active) {

                    await supabaseClient.auth.signOut();

                    showError(
                        "Dieses Mitarbeiterkonto ist deaktiviert."
                    );

                    return;
                }


                /*
                 * Weiterleitung anhand der Rolle
                 */

                if (profile.role === "admin") {

                    window.location.href =
                        "admin.html";

                } else {

                    window.location.href =
                        "mitarbeiter.html";
                }

            }

            catch (error) {

                console.error(
                    "Login Fehler:",
                    error
                );


                /*
                 * Benutzerfreundliche Fehlermeldungen
                 */

                if (
                    error.message &&
                    error.message.toLowerCase().includes(
                        "invalid login credentials"
                    )
                ) {

                    showError(
                        "E-Mail-Adresse oder Passwort ist falsch."
                    );

                } else {

                    showError(
                        "Anmeldung fehlgeschlagen. Bitte später erneut versuchen."
                    );
                }

            }

            finally {

                loginButton.disabled = false;

                loginButton.textContent =
                    "Einloggen";
            }

        }
    );


    /*
     * ============================================================
     * PASSWORT VERGESSEN
     * ============================================================
     */

    forgotPassword.addEventListener(
        "click",
        async function (event) {

            event.preventDefault();

            hideMessages();

            const email =
                emailInput.value.trim();


            if (!email) {

                showError(
                    "Bitte zuerst deine E-Mail-Adresse eingeben."
                );

                emailInput.focus();

                return;
            }


            try {

                const {
                    error
                } =
                    await supabaseClient.auth.resetPasswordForEmail(
                        email,
                        {
                            redirectTo:
                                window.location.origin +
                                "/passwort-reset.html"
                        }
                    );


                if (error) {
                    throw error;
                }


                showSuccess(
                    "Wenn für diese E-Mail-Adresse ein Konto vorhanden ist, wurde eine Anleitung zum Zurücksetzen des Passworts verschickt."
                );

            }

            catch (error) {

                console.error(
                    "Passwort-Reset Fehler:",
                    error
                );

                showError(
                    "Die Anfrage konnte momentan nicht verarbeitet werden."
                );
            }

        }
    );


    /*
     * ============================================================
     * BEREITS EINGELOGGT?
     * ============================================================
     */

    async function checkExistingSession() {

        try {

            const {
                data,
                error
            } =
                await supabaseClient.auth.getSession();


            if (error) {
                return;
            }


            if (!data.session) {
                return;
            }


            const user =
                data.session.user;


            const {
                data: profile,
                error: profileError
            } =
                await supabaseClient
                    .from("profiles")
                    .select(
                        "id, first_name, last_name, role, active"
                    )
                    .eq("id", user.id)
                    .single();


            if (profileError) {
                return;
            }


            if (!profile.active) {

                await supabaseClient.auth.signOut();

                return;
            }


            if (profile.role === "admin") {

                window.location.href =
                    "admin.html";

            } else {

                window.location.href =
                    "mitarbeiter.html";
            }

        }

        catch (error) {

            console.error(
                "Session Prüfung:",
                error
            );
        }
    }


    checkExistingSession();

</script>

</body>
</html>
